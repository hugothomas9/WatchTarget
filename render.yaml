# Blueprint Render — service WEB uniquement (FastAPI + front React buildé).
#
# Répartition des 3 briques sur des offres gratuites (voir README-DEPLOY.md) :
#   * web      → ICI (Render free, Dockerfile)
#   * Postgres → Neon (la base gratuite de Render expire au bout de 30 jours)
#   * worker   → GitHub Actions (.github/workflows/worker.yml), pas de cron gratuit
#                chez Render
#   * bot      → PAS de service séparé : mode webhook servi par le service web
#                (/api/telegram/webhook), car le long polling exige un process
#                allumé en permanence, ce que l'offre gratuite ne donne pas.
#
# Utilisation : Render → New → Blueprint → choisir le repo. Les variables
# marquées `sync: false` ne sont PAS dans le repo : Render les demande au
# déploiement (ou onglet Environment).
services:
  - type: web
    name: watchtarget
    runtime: docker
    plan: free            # s'endort après 15 min sans trafic, redémarre en ~1 min
    region: frankfurt
    dockerfilePath: ./Dockerfile
    autoDeploy: true      # push sur main → redéploiement
    # Render appelle ce chemin après chaque déploiement pour valider l'instance.
    # Endpoint léger et sans authentification, contrairement à « / » qui sert le front.
    healthCheckPath: /api/marques
    envVars:
      # URL Postgres Neon — prendre la connexion « pooled » (-pooler), obligatoire
      # ici : le service redémarre à chaque réveil et ouvrirait sinon trop de
      # connexions directes. Format : postgresql://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # ton id Telegram perso : seul l'admin peut déclencher /api/collecte
      - key: TELEGRAM_CHAT_ID
        sync: false
      # secret partagé avec Telegram (`openssl rand -hex 32`) : sans lui,
      # /api/telegram/webhook répond 404 et le bot reste muet.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # proxy résidentiel (Chrono24) — vide = connexion directe
      - key: PROXY_URL
        sync: false
